[project]
name = "jax-shapley"
version = "0.1.0"
description = "JAX-native reinforcement-learning environments for Shapley-value research"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "einops>=0.8.1",
    "jaxtyping>=0.3.2",
    "flax>=0.12.8",
    "gymnax==0.0.9",
    "jax>=0.6",
    "numpy>=2.0",
]

[project.optional-dependencies]
cuda = ["jax[cuda13]>=0.6"]
render = ["pillow>=11.3"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
    "ty==0.0.73",
    "tyro>=0.9",
]
benchmark = [
    "gymnasium==0.29.1",
    "matplotlib>=3.10",
    "pandas>=2.3",
    "psutil>=7.0",
    "scipy>=1.16",
]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
]
markers = [
    "compile: compile-time checks for key code paths",
    "gpu: requires a JAX GPU backend",
    "render: requires the optional rendering dependencies",
    "slow: exhaustive or performance-sensitive test",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
preview = true

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # import sorting
    "N",      # pep8 naming
    "B",      # flake8-bugbear
    "S",      # flake8-bandit
    "UP",     # pyupgrade
    "ANN",    # require useful annotations; complements ty inference
    "PYI",    # typing/stub-oriented correctness checks
    "blanket-type-ignore", # require specific type-ignore/error-code suppressions
    "SIM",    # simplifications
    "C90",    # cyclomatic complexity
    "PERF",   # performance footguns
    "RUF",    # Ruff-specific checks
]
ignore = [
    "line-too-long", # formatter owns line wrapping
    "assert", # asserts are valid in tests and invariant checks
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ty.rules]
blanket-ignore-comment = "error"
dynamic-function-decorator-return = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
invalid-assignment = "error"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.analysis]
strict-literal-narrowing = true
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
